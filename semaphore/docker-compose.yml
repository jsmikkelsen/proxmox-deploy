version: '3.8'

services:
  semaphore:
    image: semaphoreui/semaphore:latest
    container_name: semaphore-web-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Embedded SQLite database (BoltDB er udgået i nyere Semaphore versioner)
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_DB_PATH: /var/lib/semaphore/semaphore.sqlite
      SEMAPHORE_DB: /var/lib/semaphore/semaphore.sqlite

      # Opretter standard admin-bruger ved første opstart
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_NAME: "Proxmox Admin"
      SEMAPHORE_ADMIN_EMAIL: "admin@local.lan"
      SEMAPHORE_ADMIN_PASSWORD: "AdminSecretPassword123!"

      # Påkrævet 32-byte base64 krypteringsnøgle til Semaphore secrets/nøgler
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: "gs72mPntFATGJs9qK0pQ0rKtfidlexiMjYCH9gWKhTU="
    volumes:
      # Persistent data for Semaphore UI SQLite database
      - semaphore_data:/var/lib/semaphore
      - semaphore_config:/etc/semaphore
      # Adgang til deployment scripts (relativ sti til forældremappen)
      - ../:/scripts:ro

volumes:
  semaphore_data:
  semaphore_config:
